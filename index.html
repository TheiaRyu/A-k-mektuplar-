<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz! ✉️🦍</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transform: translateY(40px);
            transition: transform 0.3s ease;
        }

        /* Zarfın Ana Gövdesi */
        .envelope {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: #f0718f;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        /* Zarfın Ön Katları (Eski koddaki o gerçekçi üçgenler) */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 90px 140px 90px 0;
            border-color: transparent #f4849e transparent transparent;
            z-index: 3;
        }

        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 90px 0 90px 140px;
            border-color: transparent transparent transparent #f4849e;
            z-index: 3;
        }

        .front-flap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 140px 100px 140px;
            border-color: transparent transparent #e05a7b transparent;
            z-index: 4;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* Zarfın Üst Kapağı */
        .top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 100px 140px 0 140px;
            border-color: #d1496b transparent transparent transparent;
            transform-origin: top;
            transition: transform 0.4s ease-in-out, z-index 0.2s ease-in-out;
            z-index: 5;
        }

        /* İçinden Goril Çıkacak Mektup Kağıdı */
        .letter {
            position: absolute;
            bottom: 5px;
            left: 15px;
            width: 250px;
            height: 160px;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mektubun içindeki goril fotoğrafı */
        .letter img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 5px;
        }

        /* Zarfın Üzerindeki Küçük Kilit Kalp */
        .heart-lock {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            z-index: 6;
            transition: opacity 0.3s ease;
        }

        /* TIKLANDIĞINDA ÇALIŞACAK AKTİF DURUMLAR */
        .envelope-wrapper.open .top-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .letter {
            transform: translateY(-130px); /* Mektup ve goril yukarı fırlıyor */
            z-index: 2;
            height: 180px;
        }

        .envelope-wrapper.open .heart-lock {
            opacity: 0;
            pointer-events: none;
        }

        .hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #e05a7b;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeContainer" onclick="this.classList.toggle('open')">
        <div class="top-flap"></div>
        <div class="letter">
            <!-- Eski koddaki mektubun içine gorili koyduk -->
            <img src="goril.jpg" alt="Sürpriz">
        </div>
        <div class="envelope"></div>
        <div class="front-flap"></div>
        <div class="heart-lock">❤️</div>
        <div class="hint">Açmak için zarfa tıkla ✨</div>
    </div>

</body>
</html>
