<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz! 🦍</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: sans-serif;
            overflow: hidden;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            width: 300px;
            height: 200px;
        }

        /* Zarfın gövdesi (arkada sabit) */
        .envelope {
            position: absolute;
            bottom: 0;
            width: 300px;
            height: 180px;
            background-color: #f47a94;
            border-radius: 0 0 10px 10px;
            z-index: 2;
        }

        /* Mektup Kağıdı (içinde fotoğraf var) */
        .letter {
            position: absolute;
            bottom: 0;
            left: 25px;
            width: 250px;
            height: 160px;
            background-color: white;
            z-index: 1;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        /* Fotoğrafın boyutu */
        .letter img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Zarfın kapağı */
        .flap {
            position: absolute;
            top: 0;
            width: 300px;
            height: 150px;
            background-color: #d85473;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 3;
            transform-origin: top;
            transition: transform 0.6s;
        }

        /* Tıklandığında çalışacak animasyon */
        .open .flap {
            transform: rotateX(180deg);
        }
        
        .open .letter {
            transform: translateY(-150px); /* Mektup yukarı fırlar */
        }
        
        .hint {
            position: absolute;
            bottom: 50px;
            color: #d85473;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hint">Tıkla ve sürprizine bak ✨</div>

    <div class="envelope-wrapper" id="container" onclick="this.classList.toggle('open')">
        <div class="flap"></div>
        <div class="letter">
            <!-- BURAYA DİKKAT: Fotoğrafın adı mutlaka goril.jpg olmalı -->
            <img src="goril.jpg" alt="Sürpriz">
        </div>
        <div class="envelope"></div>
    </div>

</body>
</html>
