<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Instagram ve Sosyal Medya Önizleme Kapak Ayarı -->
<meta property="og:title" content="Sana Bir Mesajım Var ✉️">
<meta property="og:description" content="Açmak için tıklat... ✨">
<meta property="og:image" content="https://images.unsplash.com/photo-1516410529446-2c777cb7366d?q=80&w=500&auto=format&fit=crop">
<meta property="og:type" content="website">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Mesajım Var ✉️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover {
            transform: translateY(10px);
        }

        /* Zarfın Ana Gövdesi */
        .envelope {
            position: relative;
            width: 280px;
            height: 180px;
            background-color: #f0718f;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        /* Zarfın Ön Katları (Sol, Sağ ve Alt Üçgenler) */
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 90px 140px 90px 0;
            border-color: transparent #f4849e transparent transparent;
            z-index: 3;
        }

        .envelope::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 90px 0 90px 140px;
            border-color: transparent transparent transparent #f4849e;
            z-index: 3;
        }

        .front-flap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 140px 100px 140px;
            border-color: transparent transparent #e05a7b transparent;
            z-index: 4;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* Zarfın Üst Kapağı */
        .top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 100px 140px 0 140px;
            border-color: #d1496b transparent transparent transparent;
            transform-origin: top;
            transition: transform 0.4s ease-in-out, z-index 0.2s ease-in-out;
            z-index: 5;
        }

        /* İçindeki Mektup Kağıdı (Fotoğraf Alanı) */
        .letter {
            position: absolute;
            bottom: 5px;
            left: 15px;
            width: 250px;
            height: 160px;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 8px; /* Görselin tam sığması için padding düşürüldü */
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Mektubun içindeki goril fotoğrafı ayarı */
        .letter img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 5px;
        }

        /* Zarfın Üzerindeki Küçük Kilit Kalp */
        .heart-lock {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            z-index: 6;
            transition: opacity 0.3s ease;
        }

        /* TIKLANDIĞINDA ÇALIŞACAK AKTİF DURUMLAR */
        .envelope-wrapper.open .top-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .letter {
            transform: translateY(-110px); /* Gorilin tam çıkması için biraz daha yukarı kaydırıldı */
            z-index: 2;
            height: 190px;
        }

        .envelope-wrapper.open .heart-lock {
            opacity: 0;
            pointer-events: none;
        }

        /* Uçuşan Kalp Animasyonları */
        .floating-heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes floatUp {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1.2);
                opacity: 0;
            }
        }

        .hint {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: #e05a7b;
            font-size: 14px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" id="envelopeContainer">
        <div class="top-flap"></div>
        <div class="letter">
            <!-- Yazılar kalktı, yerine tam senin istediğin fotoğraf geldi -->
            <img src="goril.jpg" alt="Sürpriz">
        </div>
        <div class="envelope"></div>
        <div class="front-flap"></div>
        <div class="heart-lock">❤️</div>
        <div class="hint" id="hintText">Açmak için zarfa tıkla ✨</div>
    </div>

    <script>
        const container = document.getElementById('envelopeContainer');
        const hintText = document.getElementById('hintText');

        container.addEventListener('click', () => {
            container.classList.toggle('open');
            
            if(container.classList.contains('open')) {
                hintText.style.display = 'none';
                createHearts();
            } else {
                hintText.style.display = 'block';
            }
        });

        function createHearts() {
            for (let i = 0; i < 12; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerText = ['💖', '❤️', '💕', '🌸'][Math.floor(Math.random() * 4)];
                
                const x = (Math.random() * 200 - 100) + 'px';
                const y = (Math.random() * -150 - 50) + 'px';
                
                heart.style.setProperty('--x', x);
                heart.style.setProperty('--y', y);
                
                heart.style.left = '130px';
                heart.style.top = '70px';
                
                heart.style.animation = `floatUp ${1 + Math.random() * 1}s ease-out forwards`;
                heart.style.animationDelay = (Math.random() * 0.2) + 's';
                
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 2000);
            }
        }
    </script>

</body>
</html>
