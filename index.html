<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriiiz! 🦍</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffeef2;
            font-family: 'Segoe UI', sans-serif;
        }

        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        .envelope {
            width: 250px;
            height: 150px;
            background-color: #f47a94;
            position: relative;
            z-index: 2;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Zarfın Kapağı */
        .flap {
            width: 100%;
            height: 100%;
            background-color: #d85473;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 10px 10px 0 0;
            transform-origin: top;
            transition: transform 0.6s, z-index 0.6s;
            z-index: 3;
            backface-visibility: hidden;
        }

        .letter {
            width: 230px;
            height: 130px;
            background-color: white;
            position: absolute;
            top: 10px;
            left: 10px;
            border-radius: 5px;
            z-index: 1;
            transition: transform 0.6s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ff4d6d;
        }

        /* Mektubun İçeriği (SVG ile Çizilmiş Milk & Mocha) */
        .letter-content {
            width: 100%;
            height: 100%;
        }

        /* TIKLANDIĞINDA ÇALIŞACAK AKTİF DURUMLAR */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .letter {
            transform: translateY(-80px);
            z-index: 2;
        }

        /* Fotoğraf Alanı */
        .card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            margin-bottom: 20px;
        }

        .card img {
            width: 100%;
            max-width: 350px;
            border-radius: 10px;
            display: block;
        }

    </style>
</head>
<body>

    <div>
        <div class="card">
            <!-- Aynı klasördeki fotoğraf -->
            <img src="goril.jpg" alt="Saygılar">
        </div>

        <div class="envelope-wrapper" id="envelopeContainer">
            <div class="flap"></div>
            <div class="letter">
                <div class="letter-content">
                    <!-- Milk & Mocha Çizimi -->
                    <svg viewBox="0 0 100 60">
                        <circle cx="30" cy="30" r="10" fill="#ffffff" stroke="#1c110b" stroke-width="1.5"/>
                        <circle cx="70" cy="30" r="10" fill="#b08362" stroke="#1c110b" stroke-width="1.5"/>
                        <circle cx="30" cy="30" r="1.5" fill="#1c110b"/>
                        <circle cx="70" cy="30" r="1.5" fill="#1c110b"/>
                        <ellipse cx="30" cy="35" rx="3" ry="2" fill="#fcaec1"/>
                        <ellipse cx="70" cy="35" rx="3" ry="2" fill="#fcaec1"/>
                        <path d="M 30 38 Q 32 40 34 38 M 70 38 Q 72 40 74 38" fill="none" stroke="#1c110b" stroke-width="1"/>
                        <path d="M 45 30 Q 50 35 55 30 L 50 25 Z" fill="#ff4d6d"/>
                        <text x="50" y="55" font-family="Arial" font-size="6" fill="#1c110b" text-anchor="middle">İyi ki varsın!</text>
                    </svg>
                </div>
            </div>
            <div class="envelope"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('envelopeContainer');
        container.addEventListener('click', () => {
            container.classList.toggle('open');
        });
    </script>

</body>
</html>
